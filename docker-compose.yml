
# ============================================================
# SidGigs HR Backend — Docker Compose
# ============================================================

services:
  sidgigs-hr-backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: sidgigs-hr-backend:latest
    container_name: sidgigs_hr_backend
    restart: unless-stopped

    ports:
      - "3002:3002"

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3002"
      HOST: "0.0.0.0"
      APP_URL: ${APP_URL:-https://api.hr.sidegigs.app}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      SYSTEM_ENV: ${SYSTEM_ENV:-production}
      LOGGING_FORMAT: ${LOGGING_FORMAT:-combined}
      SIDEGIGS_API_URL: ${SIDEGIGS_API_URL}

    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
